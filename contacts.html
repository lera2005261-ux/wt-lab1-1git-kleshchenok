<!DOCTYPE html>
<html lang="ru">
<head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Как я провел лето</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacts.html">Контакты</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="container my-5">
        <h1 class="mb-4">Контакты</h1>

        <div class="row g-4">
            <div class="col-md-5">
                <ul class="list-group">
                    <li class="list-group-item"><strong>Email:</strong> ivanov@example.com</li>
                    <li class="list-group-item"><strong>Телефон:</strong> +375 (29) 123-45-67</li>
                    <li class="list-group-item"><strong>Telegram:</strong> @ivanov</li>
                </ul>
            </div>

            <div class="col-md-7">
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Ваше имя</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="msg" class="form-label">Сообщение</label>
                        <textarea class="form-control" id="msg" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2024 Иванов И.И.</p>
